  <!-- LOGIN MODAL -->
<div class="modal" id="loginModal">

    <div class="modal-content">

        <button class="close-btn" onclick="closeLogin()">
            &times;
        </button>

        <div class="modal-logo">
            Z83 <span>SmartApply</span>
        </div>

        <h2>
            Welcome Back
        </h2>

        <p>
            Sign in to continue your application.
        </p>

        <form id="loginForm">

            <label for="email">
                Email Address
            </label>

            <input type="email"
                   id="email"
                   placeholder="Enter your email"
                   required>


            <label for="password">
                Password
            </label>

            <input type="password"
                   id="password"
                   placeholder="Enter your password"
                   required>


            <button type="submit"
                    class="primary-btn full-width">
                Sign In
            </button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a href="#" onclick="createAccount()">
                Create one
            </a>
        </p>

    </div>

</div>
